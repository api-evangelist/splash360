aid: splash360
name: Splash 360
description: 'French vendor of point-of-sale and management software for collective catering — company
  restaurants, school and institutional canteens. The product line covers a smart till, self-service ordering
  kiosks and kiosk software, Wifi Order, a Kitchen Display System, a back-office management layer, a coin
  handler, and loyalty through a YouFid integration. NO PUBLIC API SURFACE: the company sells and deploys
  into catering operators directly, and publishes no developer portal, API documentation or machine-readable
  contract. That is the absence of a PUBLIC interface, not the absence of APIs — a till, a kiosk and a
  kitchen display exchanging orders are API-driven by construction, but those interfaces reach customers
  through deployment and integration work rather than a public developer program.'
