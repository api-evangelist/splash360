x-evidence:
  round: '2026-08-19'
  admitted_from: Add-API parked queue, submission splash-360-fdc34922, gate confidence 3, reason no_consumable_surface.
  why_listed_not_dropped: no_consumable_surface is not sufficient grounds to drop. The question is whether
    this is a real company on a domain it owns, and it is. splash360.fr returns 200 with 223,583b and
    a real product site; an invented path returns a genuine 404, so the host discriminates. A valid company
    with no public API gets listed and scores low — the low score is the point, and it is what gives the
    vendor something to act on.
  dev_surface_probed_2026_08_19: /api, /developers, /developpeurs, /docs, /openapi.json, /apis.json and
    /llms.txt all return 404. Probed with a browser user-agent, so these are real absences and not a bot-protection
    artifact masking them.
  wording: Recorded as no PUBLIC API surface rather than no APIs. Tills, kiosks and kitchen displays exchanging
    orders are API-driven by construction; those interfaces simply do not reach a public developer program.
